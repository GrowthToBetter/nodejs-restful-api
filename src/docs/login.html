<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - Node RESTful API</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #f1f5f9;
      padding: 20px;
    }
    .card {
      width: 100%;
      max-width: 440px;
      background: #ffffff;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
    }
    .card-header {
      height: 160px;
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .card-header svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0.18;
    }
    .card-header-badge {
      position: relative;
      z-index: 2;
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(4px);
      padding: 10px 24px;
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #ffffff;
      font-weight: 700;
      font-size: 15px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      text-align: center;
    }
    .card-body {
      padding: 32px 36px 36px 36px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #64748b;
      margin-bottom: 8px;
    }
    .form-input {
      width: 100%;
      padding: 10px 14px;
      font-size: 14px;
      color: #1e293b;
      background-color: #f8fafc;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .form-input:focus {
      outline: none;
      background-color: #ffffff;
      border-color: #22c55e;
      box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.15);
    }
    .error-alert {
      display: none;
      background-color: #fef2f2;
      border: 1px solid #fecaca;
      color: #dc2626;
      font-size: 13px;
      padding: 10px 14px;
      border-radius: 4px;
      margin-bottom: 18px;
      text-align: center;
    }
    .btn-container {
      display: flex;
      justify-content: center;
      margin-top: 26px;
    }
    .btn-login {
      background-color: #22c55e;
      color: #ffffff;
      border: none;
      padding: 10px 48px;
      border-radius: 9999px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      text-transform: lowercase;
      letter-spacing: 0.5px;
      transition: background-color 0.2s, transform 0.1s;
    }
    .btn-login:hover {
      background-color: #16a34a;
    }
    .btn-login:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="card-header">
      <svg viewBox="0 0 400 160" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="400" height="160" fill="#0f172a" />
        <circle cx="80" cy="120" r="45" fill="#334155" />
        <rect x="140" y="40" width="180" height="100" rx="6" fill="#1e293b" />
        <rect x="155" y="55" width="150" height="70" rx="3" fill="#334155" />
        <rect x="195" y="145" width="70" height="6" rx="3" fill="#475569" />
        <circle cx="340" cy="50" r="18" fill="#334155" />
      </svg>
      <div class="card-header-badge">SIGN IN - NODE RESTFUL API</div>
    </div>
    <div class="card-body">
      <div id="errorAlert" class="error-alert"></div>
      <form id="loginForm" method="POST" action="/api-docs/login">
        <div class="form-group">
          <label class="form-label" for="username">Username</label>
          <input class="form-input" type="text" id="username" name="username" placeholder="baratrahjaga" required autofocus />
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input class="form-input" type="password" id="password" name="password" placeholder="••••••••" required />
        </div>
        <div class="btn-container">
          <button type="submit" id="submitBtn" class="btn-login">login</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const errorAlert = document.getElementById("errorAlert");
    if (urlParams.has("error")) {
      errorAlert.textContent = "Username or password wrong";
      errorAlert.style.display = "block";
    }

    const form = document.getElementById("loginForm");
    const submitBtn = document.getElementById("submitBtn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorAlert.style.display = "none";
      submitBtn.disabled = true;
      submitBtn.textContent = "logging in...";

      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;

      try {
        const response = await fetch("/api-docs/login", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ username, password })
        });

        const result = await response.json();

        if (response.ok && result.redirect) {
          window.location.href = result.redirect;
        } else {
          errorAlert.textContent = result.errors || "Username or password wrong";
          errorAlert.style.display = "block";
          submitBtn.disabled = false;
          submitBtn.textContent = "login";
        }
      } catch (err) {
        form.submit();
      }
    });
  </script>
</body>
</html>
